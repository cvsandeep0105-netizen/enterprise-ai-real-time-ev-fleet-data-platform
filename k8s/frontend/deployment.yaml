apiVersion: apps/v1
kind: Deployment
metadata:
  name: evfleet-frontend
  namespace: ev-fleet
  labels:
    app: evfleet-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evfleet-frontend
  template:
    metadata:
      labels:
        app: evfleet-frontend
    spec:
      containers:
        - name: evfleet-frontend
          image: evfleet-frontend:area26-final
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: evfleet-frontend
  namespace: ev-fleet
spec:
  type: ClusterIP
  selector:
    app: evfleet-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP