apiVersion: v1
kind: PersistentVolume
metadata:
  name: evfleet-ai-models-pv
  labels:
    app: evfleet
    component: ai-model-storage
    area: "29"
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/evfleet-ai-models
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - desktop-control-plane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evfleet-ai-models
  namespace: ev-fleet
  labels:
    app: evfleet
    component: ai-model-storage
    area: "29"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: evfleet-ai-models-pv
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evfleet-ai-model-persistence
  namespace: ev-fleet
  labels:
    app: evfleet
    component: ai-model-storage
    area: "29"
data:
  MODEL_PATH: "/app/backend/models/ev_anomaly_isolation_forest.joblib"
  MODEL_ARTIFACT: "ev_anomaly_isolation_forest.joblib"
  MODEL_VERSION: "1"
  STORAGE_TYPE: "PersistentVolume"
  RETENTION_POLICY: "Retain"
