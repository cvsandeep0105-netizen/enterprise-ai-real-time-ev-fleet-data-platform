name: EV Fleet Data Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: airflow
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U airflow -d airflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: bitnamilegacy/kafka:3.7.1-debian-12-r4
        ports:
          - 29092:29092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
          ALLOW_PLAINTEXT_LISTENER: "yes"
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/29092'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      APP_ENVIRONMENT: testing
      APP_DEBUG: "false"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      KAFKA_BROKER: localhost:29092
      KAFKA_TOPIC: ev.telemetry.v1
      PRODUCER_INTERVAL_SECONDS: "2"
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov PyYAML pip-audit

      - name: Compile backend
        run: |
          python -m compileall -q backend/app

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run Area 27 CI tests
        run: |
          python -m pytest backend/tests/test_area27_cicd.py -q

      - name: Run historical CI contract regression
        run: |
          python -m pytest backend/tests/test_area24_cicd.py -q

      - name: Run full backend regression
        run: |
          python -m pytest backend/tests -q \
            --ignore=backend/tests/test_area27_cicd.py

      - name: Fresh application contract
        run: |
          python -c "from app.main import app; paths={getattr(r,'path',None) for r in app.routes}; required={'/','/vehicles','/dashboard/summary','/analytics/battery','/analytics/status','/telemetry/','/alerts/','/auth/login','/health','/ready'}; missing=sorted(required-paths); print('ROUTE COUNT =',len(app.routes)); print('MISSING ROUTES =',missing); assert not missing, missing; print('APPLICATION CONTRACT = PASS')"

  frontend-quality:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  security-validation:
    name: Security & Dependency Validation
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt --strict

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Secret-pattern validation
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}' \
            .; then
            echo "Potential hard-coded secret detected"
            exit 1
          fi
          echo "Secret-pattern validation: PASS"
  container-validation:
    needs: [backend-quality, frontend-quality]
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --tag evfleet-backend:${{ github.sha }} \
            --file backend/Dockerfile \
            .

      - name: Build frontend image
        run: |
          docker build \
            --tag evfleet-frontend:${{ github.sha }} \
            --file frontend/Dockerfile \
            frontend

      - name: Verify images
        run: |
          docker image inspect evfleet-backend:${{ github.sha }}
          docker image inspect evfleet-frontend:${{ github.sha }}
          echo "DOCKER IMAGE VALIDATION = PASS"

  kubernetes-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    needs:
      - container-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path("k8s").rglob("*.yaml")) + list(Path("k8s").rglob("*.yml"))

          if not files:
              raise SystemExit("No Kubernetes manifests found")

          for path in files:
              documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              if not documents:
                  raise SystemExit(f"Empty Kubernetes manifest: {path}")

              for document in documents:
                  if not isinstance(document, dict):
                      raise SystemExit(f"Invalid Kubernetes document: {path}")

                  for key in ("apiVersion", "kind", "metadata"):
                      if key not in document:
                          raise SystemExit(f"Missing {key} in {path}")

              print(f"VALID: {path}")

          print("KUBERNETES MANIFEST VALIDATION = PASS")
          PY

  production-release:
    needs: [container-validation, kubernetes-validation]
    name: Production Container Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend production image
        run: docker build --pull -f backend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/evfleet-backend:${{ github.sha }} .

      - name: Build frontend production image
        run: docker build --pull -f frontend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/evfleet-frontend:${{ github.sha }} frontend

      - name: Push immutable backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/evfleet-backend:${{ github.sha }}

      - name: Push immutable frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/evfleet-frontend:${{ github.sha }}

      - name: Publish latest release tags
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/evfleet-backend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/evfleet-backend:latest
          docker tag ghcr.io/${{ github.repository_owner }}/evfleet-frontend:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/evfleet-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/evfleet-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/evfleet-frontend:latest

      - name: Release summary
        run: |
          echo "Backend image: ghcr.io/${{ github.repository_owner }}/evfleet-backend:${{ github.sha }}"
          echo "Frontend image: ghcr.io/${{ github.repository_owner }}/evfleet-frontend:${{ github.sha }}"
          echo "Immutable release: PASS"
  ci-summary:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
      - container-validation
      - kubernetes-validation

    steps:
      - name: Final CI gate
        run: |
          echo "========================================"
          echo "EV FLEET DATA PLATFORM"
          echo "AREA 27 CI QUALITY GATE"
          echo "========================================"
          echo "Backend quality       = PASS"
          echo "Frontend quality      = PASS"
          echo "Docker validation     = PASS"
          echo "Kubernetes validation = PASS"
          echo "AREA 27 CI GATE       = PASS"

